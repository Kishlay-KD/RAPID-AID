<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidAid - Driver Login</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%); }
        .login-box { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 90%; max-width: 400px; }
        .login-box h1 { text-align: center; color: #e53935; margin-bottom: 1.5rem; }
        .login-box .user-type { text-align: center; color: #666; margin-bottom: 1.5rem; font-size: 1.2rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: 500; }
        .form-group input { width: 100%; padding: 0.8rem; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .btn-block { width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem; }
        .login-footer { text-align: center; margin-top: 1.5rem; color: #666; }
        .login-footer a { color: #e53935; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1><i class="fas fa-ambulance"></i> RapidAid</h1>
            <p class="user-type"><i class="fas fa-id-card"></i> Driver Login</p>
            <form id="loginForm">
                <div class="form-group"><label for="phone">Phone Number</label><input type="tel" id="phone" placeholder="Enter your phone number" required></div>
                <div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Enter your password" required></div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-sign-in-alt"></i> Login</button>
            </form>
            <div class="login-footer"><p>New driver? <a href="driver-register.html">Register here</a></p></div>
            <a href="../index.html" style="display: block; text-align: center; margin-top: 1rem; color: #666; text-decoration: none;"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>
    <script>
        const API_BASE_URL = window.location.origin + '/api';
        
        // Check if already logged in as driver
        const savedDriver = localStorage.getItem('rapidAid_driver');
        if (savedDriver) {
            const driver = JSON.parse(savedDriver);
            if (driver.id) {
                window.location.href = 'driver.html';
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            
            // For demo, we use ambulance_id from a simple lookup
            // In production, this would be more secure
            fetch(API_BASE_URL + '/driver/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    phone: phone, 
                    password: password,
                    ambulance_id: 2  // Demo: default ambulance ID
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.ambulance && data.ambulance.id) {
                    // Save driver info to localStorage
                    localStorage.setItem('rapidAid_driver', JSON.stringify(data.ambulance));
                    localStorage.setItem('driverId', data.ambulance.id);
                    localStorage.setItem('ambulanceId', data.ambulance.id);
                    window.location.href = 'driver.html';
                } else {
                    alert(data.message || 'Login failed');
                }
            })
            .catch(err => {
                console.error('Error:', err);
                alert('Connection error. Please make sure the server is running.');
            });
        });
    </script>
</body>
</html>
