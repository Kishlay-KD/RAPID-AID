<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidAid - Driver Registration</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%); }
        .login-box { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 90%; max-width: 400px; }
        .login-box h1 { text-align: center; color: #e53935; margin-bottom: 1.5rem; }
        .login-box .user-type { text-align: center; color: #666; margin-bottom: 1.5rem; font-size: 1.2rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: 500; }
        .form-group input { width: 100%; padding: 0.8rem; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .btn-block { width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem; }
        .login-footer { text-align: center; margin-top: 1.5rem; color: #666; }
        .login-footer a { color: #e53935; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1><i class="fas fa-ambulance"></i> RapidAid</h1>
            <p class="user-type"><i class="fas fa-id-card"></i> Driver Registration</p>
            <form id="registerForm">
                <div class="form-group"><label for="name">Driver Name</label><input type="text" id="name" placeholder="Enter your name" required></div>
                <div class="form-group"><label for="phone">Phone Number</label><input type="tel" id="phone" placeholder="Enter your phone number" required></div>
                <div class="form-group"><label for="vehicleNo">Vehicle Number</label><input type="text" id="vehicleNo" placeholder="Enter vehicle number" required></div>
                <div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Create a password" required></div>
                <div class="form-group"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" placeholder="Confirm your password" required></div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-user-plus"></i> Register</button>
            </form>
            <div class="login-footer"><p>Already have an account? <a href="driver-login.html">Login here</a></p></div>
            <a href="../index.html" style="display: block; text-align: center; margin-top: 1rem; color: #666; text-decoration: none;"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (password !== confirmPassword) { alert('Passwords do not match!'); return; }
            fetch('http://localhost:5000/api/ambulances/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ driver_name: document.getElementById('name').value, phone: document.getElementById('phone').value, vehicle_number: document.getElementById('vehicleNo').value, password: password })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') { alert('Registration successful! Please login.'); window.location.href = 'driver-login.html'; }
                else { alert(data.message || 'Registration failed.'); }
            });
        });
    </script>
</body>
</html>
